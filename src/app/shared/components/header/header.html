<header class="header">

  <div class="logo">
    <img src="images/logos.png" alt="Iskender">
  </div>

  <button class="catalog-btn">

    <img
      src="images/icons/menu.svg"
      alt="menu"
      class="menu-icon">

    <span>Каталог</span>

  </button>

  <div class="search">

    <img
      src="images/icons/search.svg"
      alt="search"
      class="search-icon">

    <input
      type="text"
      placeholder="Поиск">

  </div>

  <div class="actions">

    <div class="login">
      <span class="small-text">Добро пожаловать</span>
      <span class="login-text">Вход / Регистрация</span>
    </div>

  <button class="icon-btn">
    <img
      src="images/icons/user.svg"
      alt="Профиль">
  </button>

    <button class="icon-btn">

      <img
        src="images/icons/cart.svg"
        alt="Cart">

    </button>

  </div>

</header>
