<section class="news">

  <div class="news-header">

    <h2>Новости</h2>

    <a href="#">Все</a>

  </div>

  <div class="slider">

    <button
      class="arrow left"
      (click)="scrollLeft()">

      <img
        src="images/icons/arrow-left.svg"
        alt="left">

    </button>

    <div class="cards" #cards>

  @for (item of news; track item) {

    <div class="card">

          <img
            [src]="'images/news/news' + item + '.jpg'"
            alt="Новость">

          <button class="details-btn">
            Подробнее
          </button>

        </div>

      }

    </div>

    <button
      class="arrow right"
      (click)="scrollRight()">

      <img
        src="images/icons/arrow-right.svg"
        alt="right">

    </button>

  </div>

  <div class="footer">

    <span class="active"></span>

    <span></span>

  </div>

</section>
