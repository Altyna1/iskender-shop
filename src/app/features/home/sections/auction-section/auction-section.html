<section class="auction">

  <div class="auction-header">

    <h2>Аукционные товары</h2>

    <a href="#">Перейти в каталог</a>

  </div>

  <div class="slider">

    <button
      class="arrow left"
      (click)="scrollLeft()">

      ❮

    </button>

    <div
      class="cards"
      #cards>

      @for (product of products; track product.id) {

        <app-product-card
          [product]="product"
          variant="auction">
        </app-product-card>

      }

    </div>

    <button
      class="arrow right"
      (click)="scrollRight()">

      ❯

    </button>

  </div>

  <div class="auction-footer">

    <div class="pagination">

      <span class="active"></span>

      <span></span>

    </div>

  </div>

</section>
