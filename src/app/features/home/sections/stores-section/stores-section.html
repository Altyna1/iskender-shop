<section class="stores">

  <h2>Адреса магазинов</h2>

  <div class="cards">

    @for (store of stores; track $index) {

      <div class="card">

        <div class="top">

          <div class="logo">

            <img
              src="images/logos.png"
              alt="Iskender">

          </div>

          <div class="info">

            <h3>{{ store.name }}</h3>

            <a href="#">открыть в карте</a>

          </div>

          <button class="arrow">

              <img
                  src="images/icons/arrow-right.svg"
                  alt="arrow">

          </button>
        </div>

        <hr>

        <div class="address">

          <img
            src="images/icons/location.svg"
            alt="location">

          <p>{{ store.address }}</p>

        </div>

        <div class="bottom">

          <div>

            <img
            src="images/icons/clock.svg"
            alt="clock">

            08:00 - 22:00

          </div>

          <div>

            <img
            src="images/icons/phone.svg"
            alt="phone">

            {{ store.phone }}

          </div>

        </div>

      </div>

    }

  </div>

  <div class="pagination">

    <span class="active"></span>

    <span></span>

  </div>

</section>
