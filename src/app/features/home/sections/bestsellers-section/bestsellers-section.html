<section class="bestsellers">

  <div class="section-header">

    <h2>Хиты продаж</h2>

    <a href="#">Перейти в каталог</a>

  </div>

  <div class="slider">

    <button
      class="arrow left"
      (click)="scrollLeft()">

      &#10094;

    </button>

    <div
      class="products"
      #productsContainer>

      @for (product of products; track product.id) {

        <app-product-card
          [product]="product"
          variant="default">
        </app-product-card>

      }

    </div>

    <button
      class="arrow right"
      (click)="scrollRight()">

      &#10095;

    </button>

  </div>

  <div class="section-footer">

    <div class="pagination">

      <span class="active"></span>

      <span></span>

    </div>

  </div>

</section>
