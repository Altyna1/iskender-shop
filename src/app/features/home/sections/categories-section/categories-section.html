<section class="categories">

  <h2>Категории</h2>

  <div class="grid">

    @for (item of categories; track item.title) {

      <div class="card">

        <div class="info">

          <h3>{{ item.title }}</h3>

          <small>{{ item.count }} товаров</small>

        </div>

        <div class="image">

          <img
            [src]="item.image"
            [alt]="item.title">

        </div>

      </div>

    }

  </div>

</section>
